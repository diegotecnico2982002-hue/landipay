name: CI

# Gate mínimo do projeto: build Release sem aviso e a suíte inteira verde.
# O que este pipeline NÃO faz (ainda): publicar MSI, assinar binários, rodar a
# varredura de segredos. Cada um desses tem sua tarefa em docs/08.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Gate de contagem: o job falha se a suíte executar menos (ou mais) que isto.
  # Ao adicionar testes, atualize este número — é intencional que seja explícito.
  TESTES_ESPERADOS: 108

jobs:
  build-e-testes:
    name: build + testes (.NET 8, Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache do NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Landipay.sln --nologo

      # -warnaserror: o projeto está em 0 avisos hoje; se voltar a ter, o gate trava
      # antes de virar dívida silenciosa.
      - name: Build (Release)
        run: dotnet build Landipay.sln -c Release --no-restore --nologo -warnaserror

      # Nome de arquivo EXPLÍCITO e pasta separada por assembly. O padrão do VSTest é
      # <usuário>_<máquina>_<timestamp com segundos>: dois assemblies iniciados no mesmo
      # segundo gravam o MESMO arquivo e um sobrescreve o outro (foi o que derrubou o run #3,
      # com o passo de testes verde e a contagem em 90).
      - name: Testes de unidade (Landipay.Tests)
        run: >
          dotnet test tests/Landipay.Tests -c Release --no-build --nologo
          --logger "trx;LogFileName=unitarios.trx"
          --results-directory TestResults/unitarios

      - name: Testes de fluxo de UI (Landipay.Desktop.Tests)
        run: >
          dotnet test tests/Landipay.Desktop.Tests -c Release --no-build --nologo
          --logger "trx;LogFileName=fluxo-ui.trx"
          --results-directory TestResults/fluxo-ui

      # Soma os .trx e falha se a contagem não bater: sucesso do passo passa a
      # significar "94 testes rodaram e passaram", não apenas "o comando saiu 0".
      - name: Conferir contagem da suíte
        shell: pwsh
        run: |
          $arquivos = Get-ChildItem TestResults -Recurse -Filter *.trx -ErrorAction Stop
          if (-not $arquivos) { throw "Nenhum .trx encontrado em TestResults" }

          $total = 0; $passou = 0; $falhou = 0
          foreach ($f in $arquivos) {
            [xml]$x = Get-Content $f.FullName
            $c = $x.TestRun.ResultSummary.Counters
            $total  += [int]$c.total
            $passou += [int]$c.passed
            $falhou += [int]$c.failed + [int]$c.error
            "  {0,-16} total={1} aprovados={2} falhas={3}" -f $f.Name, $c.total, $c.passed, $c.failed
          }

          "arquivos: $($arquivos.Count) · total: $total · aprovados: $passou · falhas: $falhou" |
            Tee-Object -FilePath resultado.txt
          "### Suíte: $total testes, $passou aprovados, $falhou falhas" | Out-File $env:GITHUB_STEP_SUMMARY -Append

          if ($falhou -ne 0) { throw "$falhou teste(s) com falha" }
          if ($total -ne [int]$env:TESTES_ESPERADOS) {
            throw "Esperado $env:TESTES_ESPERADOS testes, encontrado $total (arquivos: $($arquivos.Name -join ', ')). Atualize TESTES_ESPERADOS no workflow se a suíte mudou de tamanho."
          }

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: |
            TestResults
            resultado.txt
          if-no-files-found: warn
